name: CocoaPods

# Publishes Oryksa.podspec to CocoaPods Trunk when a version tag is pushed (e.g. 1.2.0),
# or by hand (Actions > CocoaPods > Run workflow) for the version in the podspec.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  trunk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag and podspec version match
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n "s/^ *s.version *= *'\(.*\)'.*/\1/p" Oryksa.podspec)
          echo "podspec $v, tag $GITHUB_REF_NAME"
          test "$v" = "$GITHUB_REF_NAME"

      - name: CocoaPods
        run: pod --version || sudo gem install cocoapods

      - name: Publish to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          test -n "$COCOAPODS_TRUNK_TOKEN" || { echo "COCOAPODS_TRUNK_TOKEN secret is missing"; exit 1; }
          pod trunk push Oryksa.podspec --allow-warnings --skip-tests
